name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Manual run: tag name to use for artifact suffix (e.g. v0.1.0-manual)'
        required: false
        default: 'manual'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Qt offscreen runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 \
            libfontconfig1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxkbcommon-x11-0 libxcb-xkb1 libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Run offline test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python build-tools/tests.py

  build:
    name: Build AppImage (${{ matrix.variant }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [light, full]
    steps:
      - uses: actions/checkout@v6

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget file ca-certificates libfuse2

      - name: Build AppImage (${{ matrix.variant }})
        run: |
          chmod +x build-tools/build_appimage.sh
          ./build-tools/build_appimage.sh "${{ matrix.variant }}"

      - name: List artifact
        run: ls -lh dist/

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: esp-flasher-ui-${{ matrix.variant }}
          path: dist/esp-flasher-ui-*.AppImage
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: Smoke / ${{ matrix.distro }} / ${{ matrix.variant }}
    needs: build
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu22.04, ubuntu24.04, ubuntu26.04, debian-trixie, fedora43, arch]
        variant: [light, full]
        include:
          - distro: ubuntu22.04
            container: 'ubuntu:22.04'
            pkg_install: |
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates file libglib2.0-0 \
                libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 \
                libfontconfig1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
                libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
                libxkbcommon-x11-0 libxcb-xkb1 libgl1
          - distro: ubuntu24.04
            container: 'ubuntu:24.04'
            pkg_install: |
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates file libglib2.0-0 \
                libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 \
                libfontconfig1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
                libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
                libxkbcommon-x11-0 libxcb-xkb1 libgl1
          - distro: ubuntu26.04
            container: 'ubuntu:26.04'
            pkg_install: |
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates file libglib2.0-0 \
                libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 \
                libfontconfig1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
                libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
                libxkbcommon-x11-0 libxcb-xkb1 libgl1
          - distro: debian-trixie
            container: 'debian:trixie'
            pkg_install: |
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates file libglib2.0-0 \
                libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 \
                libfontconfig1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
                libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
                libxkbcommon-x11-0 libxcb-xkb1 libgl1
          - distro: fedora43
            container: 'fedora:43'
            pkg_install: |
              dnf install -y \
                ca-certificates file \
                mesa-libEGL libxkbcommon dbus-libs xcb-util-cursor \
                fontconfig xcb-util-image xcb-util-keysyms \
                xcb-util-renderutil xcb-util-wm libxkbcommon-x11 \
                mesa-libGL
          - distro: arch
            container: 'archlinux:latest'
            pkg_install: |
              pacman -Sy --noconfirm --needed \
                ca-certificates file \
                libglvnd libxkbcommon dbus xcb-util-cursor \
                fontconfig xcb-util-image xcb-util-keysyms \
                xcb-util-renderutil xcb-util-wm libxkbcommon-x11
    steps:
      - name: Install runtime packages
        shell: bash
        run: |
          set -e
          ${{ matrix.pkg_install }}

      - name: Download AppImage artifact
        uses: actions/download-artifact@v8
        with:
          name: esp-flasher-ui-${{ matrix.variant }}
          path: dist

      - name: Inspect artifact
        shell: bash
        run: |
          set -e
          ls -lh dist/
          IMG=$(ls dist/esp-flasher-ui-*.AppImage | head -n1)
          chmod +x "$IMG"
          file "$IMG"
          test "$(stat -c %s "$IMG")" -gt 30000000

      - name: Smoke launch (offscreen, time-bounded)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          IMG=$(ls dist/esp-flasher-ui-*.AppImage | head -n1)
          "$IMG" --appimage-extract >/dev/null
          set +e
          QT_QPA_PLATFORM=offscreen timeout --signal=TERM --kill-after=3 6 \
            ./squashfs-root/AppRun >smoke.log 2>&1
          EXIT=$?
          set -e
          echo "AppRun exit code: $EXIT"
          tail -50 smoke.log || true
          case $EXIT in
            0|124|143) echo "smoke OK" ;;
            *) echo "smoke FAIL (exit=$EXIT)"; exit 1 ;;
          esac

  release:
    name: Publish GitHub Release
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all AppImage artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/esp-flasher-ui-*.AppImage
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
