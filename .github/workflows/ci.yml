name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + translations (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Qt offscreen runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 \
            libfontconfig1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxkbcommon-x11-0 libxcb-xkb1 libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Validate translation JSON files
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          failed = 0
          for path in sorted(Path("app/translations").glob("*.json")):
              try:
                  with path.open(encoding="utf-8") as f:
                      data = json.load(f)
              except Exception as exc:
                  print(f"[FAIL] {path}: {exc}")
                  failed += 1
                  continue
              if "_meta" not in data:
                  print(f"[FAIL] {path}: missing _meta block")
                  failed += 1
              else:
                  print(f"[OK]   {path.name} ({len(data) - 1} keys)")
          sys.exit(1 if failed else 0)
          PY

      - name: Run offline test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python build-tools/tests.py
